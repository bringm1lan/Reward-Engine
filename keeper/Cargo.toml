[workspace]

[package]
name = "distribution-keeper"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
distribution-router = { path = "../programs/distribution-router", features = ["no-entrypoint"] }
anchor-lang = "=0.32.1"
solana-sdk = "=2.3.1"
ureq = { version = "=2.12.1", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bincode = "1.3"
