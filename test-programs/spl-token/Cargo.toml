[package]
name = "router-test-spl-token"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib", "lib"]
name = "router_test_spl_token"
[dependencies]
anchor-lang = "=0.32.1"
spl-token = { version = "=8.0.0", features = ["no-entrypoint"] }
[features]
custom-heap = []
custom-panic = []
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
